# Starts the whole app:  docker compose up --build
#   Site:  http://localhost:3000        API:  http://localhost:8000/api
# Ports are bound to 127.0.0.1 only: the backend runs Django in DEBUG mode with a known
# admin password, so it is meant for local use, not for exposing on a network.
services:
  backend:
    build: ./backend/masterticket
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Database the app starts from on the FIRST run (afterwards the volume is used):
      #   db.sqlite3        (default) about 5,000 users, 1,000 events, 24,750 bookings
      #   dbs/db.sqlite3    about 100 users, 30 events, 180 bookings (small and quick)
      #   dbs/empty.sqlite3 nothing but the administrator
      # The administrator (admin / adminpassword123) comes from the backend's
      # users/migrations/0003_admin.py, so it exists whichever one is used.
      SEED_DB: ${SEED_DB:-db.sqlite3}
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
